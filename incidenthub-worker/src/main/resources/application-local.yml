spring:
  application:
    name: incidenthub-worker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5434/incidenthub}
    username: ${SPRING_DATASOURCE_USERNAME:incidenthub}
    password: ${SPRING_DATASOURCE_PASSWORD:incidenthub}
    hikari:
      maximum-pool-size: ${SPRING_DATASOURCE_MAX_POOL_SIZE:10}
      minimum-idle: ${SPRING_DATASOURCE_MIN_IDLE:2}
      connection-timeout: ${SPRING_DATASOURCE_CONNECTION_TIMEOUT_MS:30000}

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false

  flyway:
    enabled: true

server:
  port: 8081

management:
  endpoints:
    web:
      exposure:
        include: health,info

incidenthub:
  worker:
    id: ${INCIDENTHUB_WORKER_ID:local-worker-1}
    batch-size: ${INCIDENTHUB_WORKER_BATCH_SIZE:10}
    poll-delay-ms: ${INCIDENTHUB_WORKER_POLL_DELAY_MS:5000}

  alerts:
    batch-size: ${INCIDENTHUB_ALERTS_BATCH_SIZE:10}
    poll-delay-ms: ${INCIDENTHUB_ALERTS_POLL_DELAY_MS:5000}
    channel: ${INCIDENTHUB_ALERTS_CHANNEL:LOG}
    sender: ${INCIDENTHUB_ALERTS_SENDER:log}
    sns:
      topic-arn: ${INCIDENTHUB_ALERTS_SNS_TOPIC_ARN:}